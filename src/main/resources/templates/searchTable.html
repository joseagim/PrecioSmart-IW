<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>PrecioSmart - Buscar (Tabla)</title>

</head>

<body class="d-flex flex-column h-100 text-center">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0">
        <div class="container">
            <h1 class="mt-5 mb-5">Búsqueda de productos (Tabla)</h1>

            <div class="search-container mb-5">
                <form id="search-form" th:action="@{/searchTable}" method="get">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0" style="border-radius: 12px 0 0 12px;">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text" name="producto" th:value="${query}" class="form-control border-start-0"
                            placeholder="Busca por código EAN o nombre del producto..."
                            style="padding: 12px; border-radius: 0;">

                        <button id="buscar" class="btn btn-naranja" type="submit" style="border-radius: 0 12px 12px 0;">
                            <img th:src="@{/img/svg/search.svg}" class="svg-sm" alt="Icono de lupa"> Buscar
                        </button>
                    </div>
                </form>

                <div>
                    <input type="file" id="barcode-input-capture" accept="image/*" capture="environment"
                        style="display: none;" onchange="subirYEscanear(this)">

                    <input type="file" id="barcode-input-gallery" accept="image/*" style="display: none;"
                        onchange="subirYEscanear(this)">

                    <div class="d-flex justify-content-center mt-3 gap-3">
                        <button type="button" onclick="document.getElementById('barcode-input-capture').click()"
                            class="btn-scan solo-movil">
                            <img th:src="@{/img/svg/scan.svg}" class="svg-sm" alt="Escanear"> Escanear código de barras
                        </button>
                        <button type="button" onclick="document.getElementById('barcode-input-gallery').click()"
                            class="btn-scan">
                            <img th:src="@{/img/svg/scan.svg}" class="svg-sm" alt="Escanear"> Subir imagen de código EAN
                        </button>
                    </div>
                    <div id="loading" style="display: none; margin-top: 10px;">
                        <p>Procesando imagen...</p>
                    </div>
                </div>
            </div>
            <div th:if="${error}" class="panel-sm mb-4">
                <span th:text="${error}"></span>
                <div>
                    <a th:href="@{/user/request(name=${name})}" class="btn btn-naranja mt-3">Añadir producto</a>
                </div>
            </div>
            <div th:if="${productos != null and productos.totalElements > 0}" class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-naranja">
                        <tr>
                            <th scope="col">Nombre</th>
                            <th scope="col">Marca</th>
                            <th scope="col">Cantidad</th>
                            <th scope="col">EAN</th>
                            <th scope="col">Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${productos}">
                            <td class="fw-bold text-naranja" th:text="${p.name}">Nombre</td>
                            <td th:text="${p.brand}">Marca</td>
                            <td th:text="${p.quantity}">Cantidad</td>
                            <td th:text="${p.EAN}">EAN</td>
                            <td>
                                <a th:href="@{/product/{productoID}(productoID=${p.id})}"
                                    class="btn btn-naranja btn-sm btn-comparar">
                                    Comparar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <nav th:if="${productos != null and productos.totalPages > 1}" class="mt-5">
                <ul class="pagination justify-content-center">

                    <li class="page-item" th:classappend="${productos.first} ? 'disabled'">
                        <a class="page-link" th:href="@{${paginationUrl}(page=${productos.number})}">&laquo;</a>
                    </li>

                    <li class="page-item" th:classappend="${productos.number == 0} ? 'active'">
                        <a class="page-link" th:href="@{${paginationUrl}(page=${1})}">1</a>
                    </li>

                    <li class="page-item disabled" th:if="${productos.number + 1 > 3}">
                        <span class="page-link">...</span>
                    </li>

                    <th:block th:if="${productos.totalPages > 2}">
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(T(java.lang.Math).max(2, productos.number), T(java.lang.Math).min(productos.totalPages - 1, productos.number + 2))}"
                            th:classappend="${i == productos.number + 1} ? 'active'">
                            <a class="page-link" th:href="@{${paginationUrl}(page=${i})}" th:text="${i}">i</a>
                        </li>
                    </th:block>

                    <li class="page-item disabled" th:if="${productos.number < productos.totalPages - 3}">
                        <span class="page-link">...</span>
                    </li>

                    <li class="page-item" th:classappend="${productos.number == productos.totalPages - 1} ? 'active'">
                        <a class="page-link" th:href="@{${paginationUrl}(page=${productos.totalPages})}"
                            th:text="${productos.totalPages}">999</a>
                    </li>

                    <li class="page-item" th:classappend="${productos.last} ? 'disabled'">
                        <a class="page-link" th:href="@{${paginationUrl}(page=${productos.number + 2})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </main>

    <script th:src="@{/js/script-scan.js}"></script>

    <th:block th:replace="~{fragments/footer.html :: footer}" />

</body>

</html>
