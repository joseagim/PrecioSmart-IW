<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Request Info - Fragment</title>
</head>

<body>
    <div th:fragment="productInfo (product, carts, u)" class="d-flex flex-column flex-md-row rounded-4 overflow-hidden align-items-center align-items-md-start">

        <div class="px-4 py-3 px-md-5 py-md-4 flex-shrink-0 bg-light" style="max-width: 300px;">
            <img class="img-fluid rounded-3"
                th:src="@{/product/{productoID}/pic(productoID=${product != null ? product.id : 0})}"
                alt="foto del producto">
        </div>

        <div class="card-body text-start px-4 py-3 px-md-5 py-md-4">

            <h1 id="product-title" class="card-title mb-4 fs-2 fw-bold"><b th:text="${product?.name}">Nombre
                    del
                    producto</b></h1>
            <div class="d-flex flex-column">
                <ul class="list-unstyled mb-3">
                    <li class="my-2 pb-2 border-bottom border-subtle">
                        <h4 class="fs-5 mb-0"><b class="text-secondary">Marca: </b><span
                                th:text="${product?.brand}">-</span></h4>
                    </li>
                    <li class="my-2 pb-2 border-bottom border-subtle">
                        <h4 class="fs-5 mb-0"><b class="text-secondary">Cantidad: </b><span
                                th:text="${product?.quantity}">-</span></h4>
                    </li>
                    <li class="my-2 pb-2 border-bottom border-subtle">
                        <h4 class="fs-5 mb-0"><b class="text-secondary ">Codigo EAN: </b><span
                                th:text="${product?.EAN}">-</span></h4>
                    </li>
                </ul>
                <div th:if="${u}">
                    <form id="add-to-cart-form"
                        th:action="@{/user/cart/add/{productId}(productId=${product != null ? product.id : 0})}"
                        method="post"
                        class="d-flex flex-wrap gap-3 mt-3 mb-1 justify-content-start align-items-center">
                        <button th:if="${carts != null and !#lists.isEmpty(carts)}" id="buy-button"
                            type="submit" th:attr="data-product-id=${product != null ? product.id : 0}"
                            class="btn btn-naranja px-4 py-3 text-nowrap rounded-3">Añadir
                            al carrito
                        </button>
                        <div class="d-flex align-items-center gap-2">
                            <label for="cantidad" class="mb-0 fw-semibold text-secondary">Cant.</label>
                            <input class="form-control text-center rounded-3" type="number" id="cantidad"
                                name="cantidad" style="width: 5.2em;" min="1" value="1">
                        </div>

                        <div th:if="${carts != null and !#lists.isEmpty(carts)}"
                            class="d-flex align-items-center gap-2">
                            <label for="cartId" class="mb-0 fw-semibold text-secondary">Carrito</label>
                            <select id="cartId" name="cartId" class="form-select form-select-lg" required>
                                <option value="" selected disabled hidden>Selecciona un carrito...</option>
                                <option th:each="c : ${carts}" th:value="${c.id}" th:text="${c.name}">
                                    Carrito
                                </option>
                            </select>
                        </div>

                        <div th:unless="${carts != null and !#lists.isEmpty(carts)}"
                            class="d-flex align-items-center gap-2">
                            <button type="submit" class="btn btn-naranja btn-md px-4 py-3 shadow-sm">Crear
                                nuevo carrito y añadir
                            </button>
                        </div>
                    </form>
                    <div id="registroFeedback" class="alert d-none mt-3" role="alert">
                        <p class="mb-0"></p>
                    </div>
                </div>
                <div th:unless="${u}">
                    <a th:href="@{/login}" class="btn btn-naranja px-4 py-3 text-nowrap rounded-3">Inicia
                        sesión para crear un carrito</a>
                </div>
            </div>
        </div>
        <div th:if="${u != null and u.hasRole('ADMIN') and (edit == null or !edit)}">
            <a th:href="@{/product/{productoID}/edit(productoID=${product.id})}" 
                class="btn btn-naranja mt-auto btn-comparar">
                <img th:src="@{/img/svg/edit.svg}" class="svg-md" alt="Editar">
            </a>
        </div>
    </div>
</body>
</html>
