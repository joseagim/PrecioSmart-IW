<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Request Info - Fragment</title>
</head>

<body>
    <div th:fragment="adminSupers (supermarkets)">

        <h1 class="mt-5 mb-5">Administrar supermercados</h1>
        <a th:href="@{/admin/supermarkets/0}" class="btn btn-naranja mt-auto btn-comparar">
            Crear
        </a>
        <div class="panel-xl mb-5 row row-cols-1 row-cols-md-3 g-4 justify-content-center">

            <div class="col" th:each="s : ${supermarkets}">
                <div class="card h-100 card-naranja shadow-sm">
                    <img class="card-img-top img-producto" th:src="@{/admin/supermarkets/{supermarketID}/pic(supermarketID=${s.id})}" alt="foto del producto">
                    <div class="card-body d-flex flex-column text-center">
                        <h5 class="card-title text-naranja fw-bold" th:text="${s.name}">Nombre</h5>
                        <ul class="list-group list-group-flush text-start mb-3">
                            <li class="list-group-item medium">Información: <span th:text="${s.info}"></span></li>
                        </ul>
                        <a th:href="@{/admin/supermarkets/{supermarketID}(supermarketID=${s.id})}" class="btn btn-naranja mt-auto btn-comparar mb-2">
                            Editar
                        </a>
                        <form th:action="@{/admin/supermarkets/delete}" method="post" class="flex-grow-1"
                            th:onsubmit="return confirm('¿Estás completamente seguro de eliminar este supermercado? Se perderán todos los precios de productos asociados a él.');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="supermarketID" th:value="${s.id}">
                            <button type="submit" class="btn btn-danger w-100 py-2 rounded-3 text-white fw-bold border-0">
                                Eliminar
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <nav th:if="${supermarkets.totalPages > 1}" class="    mt-5">
            <ul class="pagination justify-content-center">
                
                <li class="page-item" th:classappend="${supermarkets.first} ? 'disabled'">
                    <a class="page-link" th:href="@{${paginationUrl}(page=${supermarkets.number})}">&laquo;</a>
                </li>      

                <li class="page-item" th:classappend="${supermarkets.number == 0} ? 'active'">
                    <a class="page-link" th:href="@{${paginationUrl}(page=${1})}">1</a>
                </li>

                <li class="page-item disabled" th:if="${supermarkets.number + 1 > 3}">
                    <span class="page-link">...</span>
                </li>

                <th:block th:if="${supermarkets.totalPages > 2}">
                    <li class="page-item" 
                        th:each="i : ${#numbers.sequence(T(java.lang.Math).max(2, supermarkets.number), T(java.lang.Math).min(supermarkets.totalPages - 1, supermarkets.number + 2))}"
                        th:classappend="${i == supermarkets.number + 1} ? 'active'">
                        <a class="page-link" th:href="@{${paginationUrl}(page=${i})}" th:text="${i}">i</a>
                    </li>
                </th:block>

                <li class="page-item disabled" th:if="${supermarkets.number < supermarkets.totalPages - 3}">
                    <span class="page-link">...</span>
                </li>

                <li class="page-item" th:classappend="${supermarkets.number == supermarkets.totalPages - 1} ? 'active'">
                    <a class="page-link" th:href="@{${paginationUrl}(page=${supermarkets.totalPages})}" th:text="${supermarkets.totalPages}">999</a>
                </li>

                <li class="page-item" th:classappend="${supermarkets.last} ? 'disabled'">
                    <a class="page-link" th:href="@{${paginationUrl}(page=${supermarkets.number + 2})}">&raquo;</a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
