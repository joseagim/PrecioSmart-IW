<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>PrecioSmart - Admin</title>
    <link rel="stylesheet" th:href="@{/css/simple-datatables-10.css}" href="/css/simple-datatables-10.css"
        type="text/css" />
</head>

<body class="d-flex flex-column h-100 text-center">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0">
        <div class="container">
            <div th:if="${admin == null}" class="d-flex flex-column align-items-center justify-content-center gap-4 mt-5">
                <h2>Panel de Administración</h2>
                <a href="/admin/mod" class="btn btn-naranja rounded-pill px-4 mt-4"><h3>Gestionar Requests</h3></a>
                <a href="/admin/supermarkets" class="btn btn-naranja rounded-pill px-4 mt-4"><h3>Gestionar Supermercados</h3></a>
                <a href="/admin/users" class="btn btn-naranja rounded-pill px-4 mt-4"><h3>Gestionar Usuarios</h3></a>
            </div>
            <div th:if="${admin=='requests'}">
                <div th:replace="~{fragments/admin_mod.html :: adminMod(${requests}, ${type})}"></div>
            </div>
            <div th:if="${admin=='supermarkets'}">
                <div th:replace="~{fragments/admin_supers.html :: adminSupers(${supermarkets})}"></div>
            </div>
        </div>

        <script th:src="@{/js/script-admin.js}"></script>

    </main>

    <th:block th:replace="~{fragments/footer.html :: footer}" />


</body>

</html>
